<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Araçları · Dijital Çakı</title>
<link rel="icon" href="/icons/dijital-caki.svg">
<link rel="stylesheet" href="/tool.css?v=20261126d">
<link rel="stylesheet" href="/gunluk/style.css?v=1">
<link rel="stylesheet" href="style.css?v=1">
<script src="/theme.js?v=20261126c"></script>
<script src="../vendor/pdf-lib.min.js?v=1.17.1" defer></script>
<script type="module" src="app.js?v=2"></script>
</head>
<body>
<main class="tool daily">
<header><a class="back" href="/#belge">Uygulamalar</a><h1 id="title">PDF Araçları</h1><p class="intro" id="intro"></p></header>
<form id="settings">
  <section class="panel">
    <label id="file-label" for="file">PDF seç</label>
    <input id="file" type="file" accept=".pdf,application/pdf">
    <p id="file-info" class="muted"></p>
    <div id="options"></div>
  </section>
  <section class="panel" id="document-preview" hidden>
    <h2>Sayfa önizlemesi</h2>
    <div class="row">
      <button type="button" id="previous" aria-label="Önceki sayfa">‹</button>
      <span id="page-label" aria-live="polite"></span>
      <button type="button" id="next" aria-label="Sonraki sayfa">›</button>
    </div>
    <canvas id="preview" class="canvas" role="img" aria-label="Seçilen PDF sayfası"></canvas>
  </section>
  <div class="row"><button id="run" class="primary" type="submit" disabled>PDF indir</button><button id="cancel" type="button" hidden>İptal</button></div>
  <p id="status" role="status"></p>
</form>
<p class="muted">Dosyalar bu cihazda işlenir.</p>
</main>
</body>
</html>
