<body><main class="tool">
<header><a class="back" href="/belge/">Araçlara dön</a>
<h1>PDF Düzenle</h1><p class="intro">PDF’leri tek listede birleştir, sırala, döndür veya seçili sayfaları indir.</p></header>
<section class="panel">
<label for="file">PDF ekle</label><input id="file" type="file" multiple accept="application/pdf,.pdf">
<p id="status" role="status"></p>
<div class="row"><button id="all" disabled>Hepsini seç</button><button id="none" disabled>Seçimi kaldır</button>
<button class="primary" id="download" disabled>Seçili sayfaları indir</button></div>
<ol id="pages" class="sheet-list" aria-label="PDF sayfaları"></ol>
</section>
