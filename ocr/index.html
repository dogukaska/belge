<body><main class="tool">
<header><a class="back" href="/belge/">Araçlara dön</a>
<h1>Metni Kopyala</h1><p class="intro">Fotoğraftaki Türkçe metni çıkar, düzelt ve kopyala.</p></header>
<section class="panel">
<label for="file">Belge fotoğrafı</label><input id="file" type="file" accept="image/*">
<button id="run" class="primary" disabled>Metni çıkar</button><p id="status" role="status"></p>
<label for="result">Tanınan metin</label><textarea id="result" rows="10" placeholder="Metin burada görünecek"></textarea>
<div class="row"><button id="copy" disabled>Kopyala</button><button id="download" disabled>TXT indir</button></div></section>
</main></body></html>
